<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kivi</title>
<style>
  :root {
    --ink: #101418; --paper: #faf9f5; --green: #1e8e3e;
    --line: #e3e1da; --muted: #5a6169;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header span { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  button {
    padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--green); color: #fff; border: 0; border-radius: 8px;
  }
  #out { margin-top: 24px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .chip {
    display: inline-block; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 99px;
    padding: 3px 10px; margin: 6px 6px 0 0;
  }
  .repair { font-size: 13px; color: var(--green); margin-top: 8px; }
  .status { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Kivi</h1>
  <span id="health">checking…</span>
</header>

<main>
  <div class="row">
    <input id="q" placeholder="Ask Kivi — e.g. what did i say abt the membrne thing yestrday"
           autocomplete="off">
    <button id="go">Ask</button>
  </div>
  <div id="out"></div>
</main>

<script>
const out = document.getElementById('out');

fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('health').textContent = d.episodes + ' episodes stored';
}).catch(() => {
  document.getElementById('health').textContent = 'backend not reachable';
});

async function ask() {
  const text = document.getElementById('q').value.trim();
  if (!text) return;
  out.innerHTML = '<div class="status">thinking…</div>';
  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    const d = await res.json();
    let html = '<div class="card">' + escapeHtml(d.answer);
    if (d.repairs && d.repairs.length) {
      html += '<div class="repair">read ' +
        d.repairs.map(r => '"' + escapeHtml(r.from) + '" as "' + escapeHtml(r.to) + '"').join(', ') +
        '</div>';
    }
    if (d.citations && d.citations.length) {
      html += '<div>' + d.citations.map(c =>
        '<span class="chip">' + escapeHtml(c.source || '') + ' · ' + escapeHtml(c.when || '') + '</span>'
      ).join('') + '</div>';
    }
    html += '</div>';
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = '<div class="status">request failed: ' + escapeHtml(String(e)) + '</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('go').onclick = ask;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
